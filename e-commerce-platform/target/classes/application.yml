server:
  port: 8083

spring:
  application:
    name: ecommerce-platform
  
  datasource:
    url: jdbc:h2:mem:ecommerce
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Notification System Integration
notification:
  service:
    url: http://localhost:8082
    endpoint: /notifications
