spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/notifications?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.notificationsystem.notificationservice.event.NotificationEvent

notification:
  kafka:
    topics:
      notifications: notifications
      email: email-notifications
      sms: sms-notifications
      webhook: webhook-notifications

management:
  endpoints:
    web:
      exposure:
        include: health,info,scheduledtasks,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.notificationsystem: INFO
server:
    port: 8082